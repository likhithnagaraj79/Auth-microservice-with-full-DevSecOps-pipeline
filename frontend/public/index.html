<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auth Service</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .tab-active { @apply border-b-2 border-indigo-600 text-indigo-600; }
  </style>
</head>
<body class="bg-gray-50 min-h-screen flex items-center justify-center p-4">

<div class="w-full max-w-md">
  <!-- Header -->
  <div class="text-center mb-8">
    <h1 class="text-3xl font-bold text-gray-900">Auth Service</h1>
    <p class="text-gray-500 mt-1">JWT + OAuth2 + RBAC</p>
  </div>

  <!-- Auth Card -->
  <div id="auth-card" class="bg-white rounded-2xl shadow-lg p-8">
    <!-- Tabs -->
    <div class="flex border-b mb-6">
      <button onclick="switchTab('login')" id="tab-login"
        class="flex-1 py-2 text-sm font-medium text-gray-600 hover:text-indigo-600 transition tab-active">
        Sign In
      </button>
      <button onclick="switchTab('register')" id="tab-register"
        class="flex-1 py-2 text-sm font-medium text-gray-600 hover:text-indigo-600 transition">
        Register
      </button>
    </div>

    <!-- Login Form -->
    <form id="login-form" onsubmit="handleLogin(event)" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="login-email" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="login-password" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="••••••••" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
        Sign In
      </button>
      <div class="relative my-2">
        <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-gray-200"></div></div>
        <div class="relative flex justify-center text-xs text-gray-400"><span class="bg-white px-2">or</span></div>
      </div>
      <button type="button" onclick="googleLogin()"
        class="w-full flex items-center justify-center gap-2 border border-gray-300 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition">
        <svg class="w-4 h-4" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
        </svg>
        Continue with Google
      </button>
    </form>

    <!-- Register Form -->
    <form id="register-form" onsubmit="handleRegister(event)" class="space-y-4 hidden">
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
        <input type="text" id="reg-username" required minlength="3" maxlength="50"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="johndoe" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Email</label>
        <input type="email" id="reg-email" required
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="you@example.com" />
      </div>
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
        <input type="password" id="reg-password" required minlength="8"
          class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-indigo-500"
          placeholder="Min 8 characters" />
      </div>
      <button type="submit"
        class="w-full bg-indigo-600 text-white py-2 rounded-lg font-medium hover:bg-indigo-700 transition">
        Create Account
      </button>
    </form>

    <!-- Message -->
    <div id="message" class="mt-4 text-sm text-center hidden"></div>
  </div>

  <!-- Dashboard (shown after login) -->
  <div id="dashboard" class="hidden bg-white rounded-2xl shadow-lg p-8 space-y-6">
    <div class="flex justify-between items-start">
      <div>
        <h2 class="text-xl font-bold text-gray-900">Dashboard</h2>
        <p class="text-sm text-gray-500" id="user-info"></p>
      </div>
      <button onclick="logout()"
        class="text-sm text-red-600 hover:underline font-medium">Logout</button>
    </div>

    <div class="grid grid-cols-2 gap-3">
      <div class="bg-indigo-50 rounded-xl p-4 text-center">
        <p class="text-xs text-indigo-500 uppercase font-semibold">Role</p>
        <p class="text-lg font-bold text-indigo-700 mt-1" id="user-role">—</p>
      </div>
      <div class="bg-green-50 rounded-xl p-4 text-center">
        <p class="text-xs text-green-500 uppercase font-semibold">Status</p>
        <p class="text-lg font-bold text-green-700 mt-1">Active</p>
      </div>
    </div>

    <div>
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Access Token (preview)</h3>
      <div class="bg-gray-50 rounded-lg p-3 text-xs text-gray-500 font-mono break-all"
        id="token-preview"></div>
    </div>

    <div id="admin-panel" class="hidden">
      <h3 class="text-sm font-semibold text-gray-700 mb-2">Admin: Users</h3>
      <button onclick="loadUsers()"
        class="w-full bg-gray-100 text-gray-700 py-2 rounded-lg text-sm hover:bg-gray-200 transition">
        Load Users
      </button>
      <div id="users-list" class="mt-3 space-y-2 text-sm"></div>
    </div>
  </div>
</div>

<script src="../src/app.js"></script>
</body>
</html>
