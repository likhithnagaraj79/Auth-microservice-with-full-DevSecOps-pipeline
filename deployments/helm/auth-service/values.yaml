replicaCount: 2

image:
  repository: ghcr.io/likhithnagaraj79/auth-service
  pullPolicy: IfNotPresent
  tag: "latest"

service:
  type: ClusterIP
  port: 8080

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: auth.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: auth-tls
      hosts:
        - auth.example.com

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  PORT: "8080"
  ENV: production
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: authdb
  DB_SSLMODE: require
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  JWT_ACCESS_TTL: 15m
  JWT_REFRESH_TTL: 168h

# Secrets — set in environment-specific values files, never committed
secrets:
  DB_USER: ""
  DB_PASSWORD: ""
  JWT_ACCESS_SECRET: ""
  JWT_REFRESH_SECRET: ""
  GOOGLE_CLIENT_ID: ""
  GOOGLE_CLIENT_SECRET: ""

livenessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8080
  initialDelaySeconds: 5
  periodSeconds: 10

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65534
  fsGroup: 65534

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL
